<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- ===== METAETIQUETAS PARA PWA ===== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0c29">
  <meta name="apple-mobile-web-app-title" content="Tipazos">
  
  <!-- ===== MANIFIESTO PARA PWA ===== -->
  <link rel="manifest" href="manifest.json">
  
  <title>🏆 Tipazos TCG</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0f0c29;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      background: #0f0c29;
    }
    
    .iframe-container {
      flex: 1;
      width: 100%;
      background: #0f0c29;
      position: relative;
    }
    
    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0f0c29;
      display: block;
    }
    
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0f0c29;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-overlay p {
      color: #888;
      margin-top: 16px;
      font-size: 14px;
    }
    
    .loading-overlay .logo-loading {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      border: 3px solid #e94560;
      padding: 10px;
      background: #16213e;
      margin-bottom: 16px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <img src="https://i.postimg.cc/N5GHHFx3/Tipazos-sin-fondo.png" 
         alt="Tipazos" 
         class="logo-loading"
         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 60 60%22%3E%3Crect width=%2260%22 height=%2260%22 rx=%2216%22 fill=%22%2316213e%22/%3E%3Ctext x=%2230%22 y=%2240%22 text-anchor=%22middle%22 font-size=%2232%22%3E🏆%3C/text%3E%3C/svg%3E'">
    <div class="spinner"></div>
    <p>Cargando Tipazos TCG...</p>
  </div>

  <div class="app-wrapper">
    
    <!-- IFRAME con la app de Google Apps Script -->
    <div class="iframe-container">
      <iframe 
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbzYlyzGTzEG-21mvQVBgsgo4mQvFph-JOAsIEK_e5-A1sojKg4Nohbv0rujqOJy0IKT/exec"
        allow="geolocation; microphone; camera; payment; autoplay; encrypted-media"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
      </iframe>
    </div>
    
  </div>

  <script>
    const iframe = document.getElementById('appFrame');
    const loading = document.getElementById('loadingOverlay');
    
    iframe.addEventListener('load', function() {
      setTimeout(function() {
        loading.classList.add('hidden');
      }, 500);
    });
    
    setTimeout(function() {
      loading.classList.add('hidden');
    }, 5000);
    
    if (window.navigator.standalone) {
      document.documentElement.style.height = '100vh';
      document.documentElement.style.overflow = 'hidden';
    }
    
    window.addEventListener('load', function() {
      setTimeout(function() {
        window.scrollTo(0, 1);
      }, 300);
    });
    
    let deferredPrompt = null;
    
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      console.log('✅ App lista para instalar');
    });
    
    window.addEventListener('appinstalled', function() {
      console.log('🎉 App instalada exitosamente');
    });
    
    let reloadAttempts = 0;
    const maxReloadAttempts = 3;
    
    iframe.addEventListener('error', function() {
      if (reloadAttempts < maxReloadAttempts) {
        reloadAttempts++;
        setTimeout(function() {
          iframe.src = iframe.src;
        }, 2000);
      }
    });
  </script>
</body>
</html>
