<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- ===== METAETIQUETAS PARA PWA ===== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0c29">
  <meta name="apple-mobile-web-app-title" content="Tipazos">
  
  <!-- ===== MANIFIESTO PARA PWA ===== -->
  <link rel="manifest" href="data:application/json,{
    &quot;name&quot;:&quot;Tipazos TCG&quot;,
    &quot;short_name&quot;:&quot;Tipazos&quot;,
    &quot;start_url&quot;:&quot;https://tipazosml-sys.github.io/tipazos-tcg/&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;orientation&quot;:&quot;portrait&quot;,
    &quot;background_color&quot;:&quot;#0f0c29&quot;,
    &quot;theme_color&quot;:&quot;#e94560&quot;,
    &quot;icons&quot;:[
      {&quot;src&quot;:&quot;https://i.postimg.cc/N5GHHFx3/Tipazos-sin-fondo.png&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/png&quot;,&quot;purpose&quot;:&quot;any maskable&quot;},
      {&quot;src&quot;:&quot;https://i.postimg.cc/N5GHHFx3/Tipazos-sin-fondo.png&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/png&quot;,&quot;purpose&quot;:&quot;any maskable&quot;}
    ]
  }">
  
  <title>🏆 Tipazos TCG</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0f0c29;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      background: #0f0c29;
    }
    
    /* ===== BARRA SUPERIOR PERSONALIZADA ===== */
    .custom-header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e94560;
      flex-shrink: 0;
      z-index: 10;
      min-height: 52px;
    }
    
    .custom-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .custom-header .logo img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid #e94560;
      object-fit: cover;
    }
    
    .custom-header .logo h1 {
      font-size: 16px;
      color: #e94560;
      font-weight: bold;
    }
    
    .custom-header .logo span {
      font-size: 9px;
      color: #f5a623;
    }
    
    .custom-header .status {
      font-size: 10px;
      color: #2ecc71;
    }
    
    .custom-header .status .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #2ecc71;
      border-radius: 50%;
      margin-right: 4px;
      animation: blink 1.5s infinite;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    /* ===== IFRAME ===== */
    .iframe-container {
      flex: 1;
      width: 100%;
      background: #0f0c29;
      position: relative;
    }
    
    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0f0c29;
      display: block;
    }
    
    /* ===== LOADING ===== */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0f0c29;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-overlay .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-overlay p {
      color: #888;
      margin-top: 16px;
      font-size: 14px;
    }
    
    .loading-overlay .logo-loading {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      border: 3px solid #e94560;
      padding: 10px;
      background: #16213e;
      margin-bottom: 16px;
      object-fit: cover;
    }
    
    @media (max-width: 480px) {
      .custom-header .logo h1 { font-size: 14px; }
      .custom-header .logo span { font-size: 8px; }
      .custom-header { padding: 6px 12px; min-height: 46px; }
      .custom-header .logo img { width: 24px; height: 24px; }
    }
  </style>
</head>
<body>

  <!-- ===== LOADING ===== -->
  <div class="loading-overlay" id="loadingOverlay">
    <img src="https://i.postimg.cc/N5GHHFx3/Tipazos-sin-fondo.png" 
         alt="Tipazos" 
         class="logo-loading"
         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22 viewBox=%220 0 60 60%22%3E%3Crect width=%2260%22 height=%2260%22 rx=%2216%22 fill=%22%2316213e%22/%3E%3Ctext x=%2230%22 y=%2240%22 text-anchor=%22middle%22 font-size=%2232%22%3E🏆%3C/text%3E%3C/svg%3E'">
    <div class="spinner"></div>
    <p>Cargando Tipazos TCG...</p>
  </div>

  <!-- ===== APP PRINCIPAL ===== -->
  <div class="app-wrapper">
    
    <!-- Barra superior personalizada (SOLO UNA) -->
    <div class="custom-header">
      <div class="logo">
        <img src="https://i.postimg.cc/N5GHHFx3/Tipazos-sin-fondo.png" 
             alt="Logo" 
             onerror="this.style.display='none'">
        <div>
          <h1>Tipazos</h1>
          <span>TCG Chile</span>
        </div>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span>Online</span>
      </div>
    </div>
    
    <!-- IFRAME con la app (la barra de adentro se oculta automáticamente) -->
    <div class="iframe-container">
      <iframe 
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbzahT0z2qJxBndVr-65a0LSDcj0rrcbo790wCohw25SEEshd6BEUW22D8AwrWXNl3TZ/exec"
        allow="geolocation; microphone; camera; payment; autoplay; encrypted-media"
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
      </iframe>
    </div>
    
  </div>

  <script>
    // ===== OCULTAR LOADING =====
    const iframe = document.getElementById('appFrame');
    const loading = document.getElementById('loadingOverlay');
    
    iframe.addEventListener('load', function() {
      setTimeout(function() {
        loading.classList.add('hidden');
      }, 500);
    });
    
    setTimeout(function() {
      loading.classList.add('hidden');
    }, 5000);
    
    // ===== FORZAR PANTALLA COMPLETA =====
    if (window.navigator.standalone) {
      document.documentElement.style.height = '100vh';
      document.documentElement.style.overflow = 'hidden';
    }
    
    window.addEventListener('load', function() {
      setTimeout(function() {
        window.scrollTo(0, 1);
      }, 300);
    });
    
    // ===== DETECTAR INSTALACIÓN =====
    let deferredPrompt = null;
    
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      console.log('✅ App lista para instalar');
    });
    
    window.addEventListener('appinstalled', function() {
      console.log('🎉 App instalada exitosamente');
    });
    
    // ===== RECARGAR IFRAME SI FALLA =====
    let reloadAttempts = 0;
    const maxReloadAttempts = 3;
    
    iframe.addEventListener('error', function() {
      if (reloadAttempts < maxReloadAttempts) {
        reloadAttempts++;
        setTimeout(function() {
          iframe.src = iframe.src;
        }, 2000);
      }
    });
  </script>
</body>
</html>
